services:
  api:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "8881:8881"
    environment:
      PORT: 8881
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Everything below is optional — internal/config/config.go treats an
      # empty value as "feature not configured," never a startup failure.
      # These were already documented in .env.example but never actually
      # forwarded here, so Google sign-in/transactional email/live holiday
      # lookups have silently no-op'd on this deployment until now.
      VENDOR_APP_URL: ${VENDOR_APP_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      GOOGLE_CALENDAR_API_KEY: ${GOOGLE_CALENDAR_API_KEY}
    networks: [spotto]

  vendor:
    build:
      context: ./web
      dockerfile: vendor/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on: [api]
    networks: [spotto]

  admin:
    build:
      context: ./web
      dockerfile: admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on: [api]
    networks: [spotto]

networks:
  spotto:
    driver: bridge
