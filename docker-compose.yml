# The images are built by GitHub Actions (.github/workflows/docker-images.yml)
# on every push to main and pulled from GitHub Container Registry, so the
# server never builds them itself. SPOTTO_IMAGE_TAG pins a version (e.g.
# sha-1a2b3c4) for a rollback; it defaults to latest. To build locally
# instead, add docker-compose.build.yml (see the top of that file).
services:
  api:
    image: ghcr.io/malinanu/travellingapp-api:${SPOTTO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8881:8881"
    environment:
      PORT: 8881
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Everything below is optional — internal/config/config.go treats an
      # empty value as "feature not configured," never a startup failure.
      # These were already documented in .env.example but never actually
      # forwarded here, so Google sign-in/transactional email/live holiday
      # lookups have silently no-op'd on this deployment until now.
      VENDOR_APP_URL: ${VENDOR_APP_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      GOOGLE_CALENDAR_API_KEY: ${GOOGLE_CALENDAR_API_KEY}
      # Also documented in .env.example but never forwarded here until now —
      # same silent-no-op story as the block above: super-admin access,
      # admin-app password-reset links, live weather, and every R2 media
      # upload (vendor photos, avatars, review photos) have had no way to
      # actually receive their config on this deployment, regardless of
      # what's set in Portainer's stack environment editor, since Compose
      # only injects a var into the container if it's listed here.
      ADMIN_APP_URL: ${ADMIN_APP_URL}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS}
      # development (default) or production. Production locks the public
      # demo logins at boot and makes the seed/gendata commands refuse to run.
      APP_ENV: ${APP_ENV:-development}
      # The admin account, created or updated at every boot (min 12 chars).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TOMORROW_IO_API_KEY: ${TOMORROW_IO_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-}
      GEMINI_VIDEO_MODEL: ${GEMINI_VIDEO_MODEL:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
      INSPIRATION_DAILY_LIMIT: ${INSPIRATION_DAILY_LIMIT:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      # Phone verification (see server/.env.example) — each channel optional.
      TEXTLK_API_TOKEN: ${TEXTLK_API_TOKEN:-}
      TEXTLK_SENDER_ID: ${TEXTLK_SENDER_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_OTP_TEMPLATE: ${WHATSAPP_OTP_TEMPLATE:-}
      WHATSAPP_OTP_TEMPLATE_LANG: ${WHATSAPP_OTP_TEMPLATE_LANG:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}
      # Audio guide transcripts: shared with the transcriber service below.
      # Unset, the API queues no transcripts.
      TRANSCRIBER_TOKEN: ${TRANSCRIBER_TOKEN:-}
    # Instagram rate-limits anonymous yt-dlp requests from server IPs almost
    # immediately, so reel extraction needs a logged-in session. Drop a
    # Netscape cookies.txt (from a throwaway Instagram account) into
    # /opt/spotto/ytdlp on the host and set
    # YTDLP_COOKIES_FILE=/app/ytdlp/cookies.txt. Mounted read-write because
    # yt-dlp saves refreshed cookies back into the file.
    volumes:
      - /opt/spotto/ytdlp:/app/ytdlp
    networks: [spotto]

  vendor:
    image: ghcr.io/malinanu/travellingapp-vendor:${SPOTTO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on: [api]
    networks: [spotto]

  admin:
    image: ghcr.io/malinanu/travellingapp-admin:${SPOTTO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on: [api]
    networks: [spotto]

  # Writes transcripts of audio guides (transcriber/README.md). It idles at
  # a few tens of MB and asks the api for work every minute; the Whisper
  # model is only loaded, in a short-lived child process, while a recording
  # is being transcribed. A low CPU priority (cpu_shares, so the api wins
  # whenever it's busy; a hard cpus cap would fail on a smaller host), two
  # threads and a memory cap keep a long audiobook from starving the api.
  # Without TRANSCRIBER_TOKEN it just waits.
  transcriber:
    image: ghcr.io/malinanu/travellingapp-transcriber:${SPOTTO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      API_URL: http://api:8881
      TRANSCRIBER_TOKEN: ${TRANSCRIBER_TOKEN:-}
      CPU_THREADS: 2
    mem_limit: 1536m
    cpu_shares: 256
    depends_on: [api]
    networks: [spotto]

networks:
  spotto:
    driver: bridge
