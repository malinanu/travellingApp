<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #fbf6ed; overflow: hidden; }
  body { font-family: 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #root { height: 100%; }
  h1, h2, h3 { font-family: var(--font-display, 'Fredoka'), system-ui; margin: 0; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  textarea { font-family: inherit; }
  @keyframes spottoPulse {
    0%   { transform: translate(-50%,-50%) scale(0.6); opacity: 0.5; }
    70%  { transform: translate(-50%,-50%) scale(1.6); opacity: 0; }
    100% { opacity: 0; }
  }
  @keyframes spottoBounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40%           { transform: translateY(-5px); opacity: 1; }
  }
  .spotto-rain {
    background-image: repeating-linear-gradient(
      105deg, transparent 0 7px,
      rgba(220,235,245,0.0) 7px,
      rgba(220,235,245,0.35) 8px,
      rgba(220,235,245,0.0) 9px 14px);
    background-size: 100% 26px;
    animation: spottoRainFall 0.5s linear infinite;
    opacity: 0.7;
  }
  @keyframes spottoRainFall {
    from { background-position: 0 0; }
    to   { background-position: 14px 26px; }
  }
  @keyframes spottoGuideIn {
    from { transform: translateY(14px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
</style>
</head>
<body>
<div id="root"></div>
