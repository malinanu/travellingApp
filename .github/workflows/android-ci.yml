name: Android CI Build

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyzer & tests
        run: |
          flutter analyze
          flutter test

      - name: Build APK (Release)
        run: flutter build apk --release

      # Published as a single rolling "android-testing" pre-release rather
      # than an Actions artifact — release assets don't count against the
      # Actions artifact storage quota. Mirrors ios-build.yml. PRs only
      # verify the build compiles.
      - name: Publish APK to the android-testing release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete android-testing --yes --cleanup-tag || true
          gh release create android-testing build/app/outputs/flutter-apk/app-release.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android testing build" \
            --notes "Release APK of ${GITHUB_SHA::7}, built $(date -u '+%Y-%m-%d %H:%M UTC')."
