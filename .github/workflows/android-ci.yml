name: Android CI Build

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyzer & tests
        run: |
          flutter analyze
          flutter test

      # Stable release signing so Google Sign-In (package + SHA-1) keeps
      # matching across builds. Optional: without the secrets this step is
      # skipped and the build falls back to the debug key.
      - name: Set up release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            {
              echo "storeFile=app/release.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/key.properties
          else
            echo "ANDROID_KEYSTORE_BASE64 not set; signing with the debug key."
          fi

      - name: Build APK (Release)
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build apk --release             --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      # Published as a single rolling "android-testing" pre-release rather
      # than an Actions artifact — release assets don't count against the
      # Actions artifact storage quota. Mirrors ios-build.yml. PRs only
      # verify the build compiles.
      - name: Publish APK to the android-testing release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete android-testing --yes --cleanup-tag || true
          gh release create android-testing build/app/outputs/flutter-apk/app-release.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android testing build" \
            --notes "Release APK of ${GITHUB_SHA::7}, built $(date -u '+%Y-%m-%d %H:%M UTC')."
