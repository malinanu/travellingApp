name: Docker images

# Builds the api, vendor, admin and transcriber images and publishes them to GitHub
# Container Registry, so the server only pulls them (docker-compose.yml)
# instead of building on a small host — those builds kept running out of
# disk, memory or time. Each image is built natively for amd64 and arm64
# (staging runs on arm64) and published as one multi-arch tag: `latest`
# and `sha-<short commit>`.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'web/**'
      - 'transcriber/**'
      - 'docker-compose*.yml'
      - '.github/workflows/docker-images.yml'
  workflow_dispatch:

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/malinanu/travellingapp

jobs:
  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [api, vendor, admin, transcriber]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: api
            context: server
            dockerfile: server/Dockerfile
          - image: vendor
            context: web
            dockerfile: web/vendor/Dockerfile
          - image: admin
            context: web
            dockerfile: web/admin/Dockerfile
          # Includes the Whisper model, downloaded from Hugging Face here.
          - image: transcriber
            context: transcriber
            dockerfile: transcriber/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # NEXT_PUBLIC_* values are inlined into the browser bundle at build
      # time, so they're build args here, not runtime env in Portainer.
      # Repository variables override the defaults.
      - name: Check build settings
        if: matrix.image == 'vendor' && vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY == ''
        run: echo "::warning::Repository variable NEXT_PUBLIC_GOOGLE_MAPS_API_KEY isn't set, so the vendor site is built without a Google Maps key."

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://spottoapi.threelogiq.com' }}
            NEXT_PUBLIC_VENDOR_URL=${{ vars.NEXT_PUBLIC_VENDOR_URL || 'https://spotto-vendor.threelogiq.com' }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, vendor, admin, transcriber]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="${IMAGE_PREFIX}-${{ matrix.image }}"
          docker buildx imagetools create \
            -t "$image:latest" -t "$image:sha-${GITHUB_SHA::7}" \
            $(printf "$image@sha256:%s " *)

      - name: Show what was published
        run: docker buildx imagetools inspect "${IMAGE_PREFIX}-${{ matrix.image }}:latest"
