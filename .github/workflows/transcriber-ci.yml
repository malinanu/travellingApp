name: Transcriber CI

# Unit tests for the audio guide transcriber (transcriber/). They use a fake
# API and a fake model, so no Whisper download is needed; the real decoder
# (PyAV) is installed to test the ten-minute chunking.
#
# The image job builds the real image (the model inside) before merge, so a
# broken or oversized image never reaches the server, and transcribes a
# short spoken clip with it, offline, as the server would.

on:
  push:
    branches: [main]
    paths:
      - 'transcriber/**'
      - '.github/workflows/transcriber-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'transcriber/**'
      - '.github/workflows/transcriber-ci.yml'

jobs:
  test:
    name: Transcriber tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transcriber
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the decoder
        run: pip install "$(grep '^av==' requirements.txt)" "$(grep '^numpy==' requirements.txt)"

      - name: Run tests
        run: python -m unittest -v

  image:
    name: Transcriber image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: transcriber
          file: transcriber/Dockerfile
          platforms: linux/amd64
          tags: transcriber:ci
          load: true
          cache-from: type=gha,scope=transcriber-amd64

      - name: Size
        run: |
          size=$(docker image inspect transcriber:ci --format '{{.Size}}')
          echo "Image size: $((size / 1000000)) MB"
          echo "Image size: $((size / 1000000)) MB" >> "$GITHUB_STEP_SUMMARY"
          # One copy of the model (~0.5 GB) plus Python and its libraries.
          if [ "$size" -gt 1600000000 ]; then
            echo "::error::The image is over 1.6 GB; the model is probably stored twice."
            exit 1
          fi

      - name: Transcribe a spoken clip, offline
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng >/dev/null
          mkdir -p "$RUNNER_TEMP/clip"
          espeak-ng -s 140 -w "$RUNNER_TEMP/clip/hello.wav" \
            "Welcome to Galle Fort. The lighthouse is straight ahead of you."
          docker run --rm --network none -v "$RUNNER_TEMP/clip:/clip:ro" transcriber:ci \
            sh -c 'python transcribe.py /clip/hello.wav /tmp/out.json && cat /tmp/out.json' | tee "$RUNNER_TEMP/out.json"
          python3 - "$RUNNER_TEMP/out.json" <<'PY'
          import json, sys
          out = json.load(open(sys.argv[1]))
          text = " ".join(s["text"] for s in out["segments"])
          print("language:", out["language"], "| text:", text)
          assert out["segments"], "no speech was transcribed"
          PY
