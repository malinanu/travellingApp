name: Server & Web Apps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-server:
    name: Go Server Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run Go tests
        run: go test -v -race ./...

      - name: Verify Go build
        run: go build -v ./cmd/api

  build-web-apps:
    name: Build Web Apps (Vendor & Admin)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # web/ is an npm workspace (shared packages + vendor + admin), so
      # install once from the root against the single lockfile.
      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build Vendor Web App
        run: npm run build -w vendor
        working-directory: web

      - name: Build Admin Web App
        run: npm run build -w admin
        working-directory: web
