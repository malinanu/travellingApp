name: Server & Web Apps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-server:
    name: Go Server Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run Go tests
        run: go test -v -race ./...

      - name: Verify Go build
        run: go build -v ./cmd/server

  build-web-apps:
    name: Build Web Apps (Vendor & Admin)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            web/vendor/package-lock.json
            web/admin/package-lock.json

      - name: Build Vendor Web App
        run: |
          cd web/vendor
          npm ci
          npm run build

      - name: Build Admin Web App
        run: |
          cd web/admin
          npm ci
          npm run build
