name: iOS Build (unsigned, for sideload testing)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into an .ipa
        run: |
          set -euo pipefail
          BUILD_DIR="build/ios/iphoneos"
          mkdir -p "$BUILD_DIR/Payload"
          cp -R "$BUILD_DIR/Runner.app" "$BUILD_DIR/Payload/"
          cd "$BUILD_DIR"
          zip -qr app-release.ipa Payload
          echo "Built: $(pwd)/app-release.ipa"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-testing-ipa
          path: app/build/ios/iphoneos/app-release.ipa
          if-no-files-found: error
