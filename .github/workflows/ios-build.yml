name: iOS Build (unsigned, for sideload & simulator testing)

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # Asks Google why (or whether) it rejects the Maps key for each bundle ID the
  # app runs under. A sideloaded install is re-signed with a different bundle
  # ID, and an app-restricted key then silently shows a blank map. Prints only
  # Google's status and error message, never the key. Never fails the build.
  check-maps-key:
    runs-on: ubuntu-latest
    environment: IOS_MAPS_API_KEY
    continue-on-error: true
    steps:
      - name: Check Maps key against Google
        env:
          IOS_MAPS_API_KEY: ${{ secrets.IOS_MAPS_API_KEY || vars.IOS_MAPS_API_KEY }}
          BUNDLE_IDS: com.spotto.spotto com.spotto.spotto.QCF9KS993A
        run: |
          set -uo pipefail
          KEY="$(printf '%s' "$IOS_MAPS_API_KEY" | tr -d '\r\n' | sed -e 's/^[[:space:]"'\'']*//' -e 's/[[:space:]"'\'']*$//')"
          if [ -z "$KEY" ]; then
            echo "::warning::IOS_MAPS_API_KEY is not set."
            exit 0
          fi
          echo "Key: len=${#KEY}, prefix=${KEY:0:4}..."
          for BUNDLE in $BUNDLE_IDS; do
            BODY="$(curl -sS --max-time 20 -G 'https://maps.googleapis.com/maps/api/geocode/json' \
              -H "X-Ios-Bundle-Identifier: $BUNDLE" \
              --data-urlencode 'address=Colombo' \
              --data-urlencode "key=$KEY" || true)"
            STATUS="$(printf '%s' "$BODY" | jq -r '.status // "NO_RESPONSE"' 2>/dev/null || echo UNPARSEABLE)"
            MESSAGE="$(printf '%s' "$BODY" | jq -r '.error_message // ""' 2>/dev/null || true)"
            MESSAGE="${MESSAGE//$KEY/***}"
            echo "bundle=$BUNDLE status=$STATUS message=$MESSAGE"
          done
          echo "Reading the result:"
          echo "  'This IP, site or mobile application is not authorized' or 'iOS client application ... are blocked'"
          echo "                                            -> add that bundle ID to the key's iOS apps restriction"
          echo "  'API key is invalid' / 'expired'          -> the secret holds a wrong or deleted key"
          echo "  'must enable Billing'                     -> billing is off on the Cloud project"
          echo "  'not authorized to use this service' or 'not activated' or status OK"
          echo "                                            -> the key and bundle ID are accepted; check that"
          echo "                                               Maps SDK for iOS is enabled and allowed by the key's API restrictions"

  build-ios:
    runs-on: macos-latest
    environment: IOS_MAPS_API_KEY
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Secrets.xcconfig is gitignored, so without this the CI build has an
      # empty Google Maps key and the map shows no tiles. Also disable code
      # signing at the Runner target xcconfig level for headless CI builds.
      - name: Write Google Maps key for iOS
        env:
          IOS_MAPS_API_KEY: ${{ secrets.IOS_MAPS_API_KEY || vars.IOS_MAPS_API_KEY }}
        run: |
          CLEAN_KEY="$(printf '%s' "$IOS_MAPS_API_KEY" | tr -d '\r\n' | sed -e 's/^[[:space:]"'\'']*//' -e 's/[[:space:]"'\'']*$//')"
          if [ -n "$CLEAN_KEY" ]; then
            printf 'MAPS_API_KEY = %s\n' "$CLEAN_KEY" > ios/Flutter/Secrets.xcconfig
            echo "MAPS_API_KEY injected into Secrets.xcconfig (len=${#CLEAN_KEY}, prefix=${CLEAN_KEY:0:4}...)."
          else
            printf 'MAPS_API_KEY =\n' > ios/Flutter/Secrets.xcconfig
            echo "::warning::IOS_MAPS_API_KEY not set in GitHub secrets! Google Maps tiles will not load on iOS."
          fi
          printf '%s\n' \
            'CODE_SIGN_ENTITLEMENTS =' \
            'CODE_SIGNING_ALLOWED = NO' \
            'CODE_SIGNING_REQUIRED = NO' \
            'CODE_SIGN_IDENTITY =' \
            'CODE_SIGN_IDENTITY[sdk=iphoneos*] =' \
            'EXPANDED_CODE_SIGN_IDENTITY = -' \
            'CODE_SIGN_STYLE = Manual' \
            'DEVELOPMENT_TEAM = 0000000000' \
            'CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES = YES' >> ios/Flutter/Secrets.xcconfig

      # Headless CI runners have no Apple Developer Team or certificates.
      # Strip target entitlements, clear identities, and set manual signing in
      # project.pbxproj so Xcode does not abort an unsigned build with
      # "Building a deployable iOS app requires a selected Development Team".
      - name: Configure unsigned build settings for CI
        run: |
          python3 - <<'EOF'
          with open('ios/Runner.xcodeproj/project.pbxproj', 'r', encoding='utf-8') as f:
              s = f.read()
          s = s.replace('CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;', '')
          s = s.replace('"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Developer";', '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";')
          s = s.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
          with open('ios/Runner.xcodeproj/project.pbxproj', 'w', encoding='utf-8') as f:
              f.write(s)
          print('Successfully configured project.pbxproj for unsigned headless build.')
          EOF

      - name: Build unsigned iOS release (for physical devices)
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID || vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build ios --release --no-codesign --verbose \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Build iOS Simulator app (for Appetize.io browser testing)
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID || vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build ios --simulator \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      # The unsigned-CI settings above (CODE_SIGNING_ALLOWED = NO in
      # Secrets.xcconfig and the Podfile) also apply to the simulator build,
      # leaving Runner.app and its embedded frameworks without a valid
      # signature. arm64 simulators refuse to launch such a bundle:
      #   "The request was denied by service delegate (SBMainWorkspace)"
      # which is exactly what Appetize.io reports. Simulator apps need no
      # certificate, only an ad-hoc signature ("Sign to Run Locally"), so apply
      # one here: nested code first, then the app bundle itself.
      - name: Ad-hoc sign simulator app
        run: |
          set -euo pipefail
          APP="build/ios/iphonesimulator/Runner.app"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) -print0 |
              while IFS= read -r -d '' item; do
                codesign --force --sign - --timestamp=none "$item"
              done
          fi
          if [ -d "$APP/PlugIns" ]; then
            find "$APP/PlugIns" -depth -name '*.appex' -print0 |
              while IFS= read -r -d '' item; do
                codesign --force --sign - --timestamp=none "$item"
              done
          fi
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "Simulator app architectures: $(lipo -archs "$APP/Runner")"
          echo "MinimumOSVersion: $(plutil -extract MinimumOSVersion raw -o - "$APP/Info.plist")"

      # Install and launch the exact bundle that gets zipped for Appetize, so a
      # launch denial fails the build here instead of surfacing in the browser.
      - name: Smoke-test launch on iOS Simulator
        timeout-minutes: 15
        run: |
          set -euo pipefail
          APP="build/ios/iphonesimulator/Runner.app"
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")"
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime in sorted(data, reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in data[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"])
                      sys.exit(0)
          sys.exit("No available iPhone simulator found")
          ')"
          echo "Using simulator $UDID for $BUNDLE_ID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 15
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q "$BUNDLE_ID"; then
            echo "::error::$BUNDLE_ID launched but exited within 15s (crash on startup)."
            xcrun simctl spawn "$UDID" log show --last 1m --predicate 'process == "Runner"' | tail -n 200 || true
            exit 1
          fi
          echo "$BUNDLE_ID is running on the simulator."
          xcrun simctl shutdown "$UDID" || true

      - name: Verify Google Maps key in Info.plist
        env:
          IOS_MAPS_API_KEY: ${{ secrets.IOS_MAPS_API_KEY || vars.IOS_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          for plist in "build/ios/iphoneos/Runner.app/Info.plist" "build/ios/iphonesimulator/Runner.app/Info.plist"; do
            if [ ! -f "$plist" ]; then
              echo "::error::Missing built Info.plist at $plist"
              exit 1
            fi
            KEY_VAL="$(plutil -extract GMSApiKey raw -o - "$plist" 2>/dev/null || true)"
            if [ -z "$KEY_VAL" ] || [[ "$KEY_VAL" == \$* ]]; then
              if [ -n "$IOS_MAPS_API_KEY" ]; then
                echo "::error::GMSApiKey in $plist is empty or unresolved ('$KEY_VAL') even though IOS_MAPS_API_KEY was set!"
                exit 1
              else
                echo "::warning::GMSApiKey in $plist is empty/unresolved (IOS_MAPS_API_KEY not set)."
              fi
            else
              echo "Verified GMSApiKey in $plist (len=${#KEY_VAL}, prefix=${KEY_VAL:0:4}...)."
            fi
          done

      - name: Package artifacts
        run: |
          set -euo pipefail
          # 1. Package .ipa for real device sideloading
          BUILD_DIR="build/ios/iphoneos"
          mkdir -p "$BUILD_DIR/Payload"
          cp -R "$BUILD_DIR/Runner.app" "$BUILD_DIR/Payload/"
          cd "$BUILD_DIR"
          zip -qr app-release.ipa Payload
          echo "Built IPA: $(pwd)/app-release.ipa"
          cd ../../..

          # 2. Package .zip for Appetize.io browser simulator
          SIM_DIR="build/ios/iphonesimulator"
          cd "$SIM_DIR"
          zip -qr app-simulator.zip Runner.app
          echo "Built Simulator ZIP: $(pwd)/app-simulator.zip"
          cd ../../..

      # Published as a single rolling "ios-testing" pre-release
      - name: Publish to ios-testing release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete ios-testing --yes --cleanup-tag || true
          gh release create ios-testing \
            build/ios/iphoneos/app-release.ipa \
            build/ios/iphonesimulator/app-simulator.zip \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "iOS testing build" \
            --notes "Unsigned build of ${GITHUB_SHA::7}, built $(date -u '+%Y-%m-%d %H:%M UTC'). Includes app-release.ipa (sideload) and app-simulator.zip (upload to Appetize.io to run in browser on Windows)."
