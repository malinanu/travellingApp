name: iOS Build (unsigned, for sideload testing)

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into an .ipa
        run: |
          set -euo pipefail
          BUILD_DIR="build/ios/iphoneos"
          mkdir -p "$BUILD_DIR/Payload"
          cp -R "$BUILD_DIR/Runner.app" "$BUILD_DIR/Payload/"
          cd "$BUILD_DIR"
          zip -qr app-release.ipa Payload
          echo "Built: $(pwd)/app-release.ipa"

      # Published as a single rolling "ios-testing" pre-release rather than an
      # Actions artifact — release assets don't count against the Actions
      # artifact storage quota, which per-push .ipa artifacts kept filling.
      # PRs only verify the build compiles.
      - name: Publish .ipa to the ios-testing release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete ios-testing --yes --cleanup-tag || true
          gh release create ios-testing build/ios/iphoneos/app-release.ipa \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "iOS testing build" \
            --notes "Unsigned sideload build of ${GITHUB_SHA::7}, built $(date -u '+%Y-%m-%d %H:%M UTC')."
