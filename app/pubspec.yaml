name: spotto
description: "Spotto — your Weligama travel companion."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.17
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^10.3.1
  dio: ^5.7.0
  url_launcher: ^6.3.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  geolocator: ^14.0.2
  image_picker: ^1.1.2
  video_player: ^2.9.2
  flutter_compass: ^0.8.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  google_maps_flutter: ^2.18.0
  flutter_cache_manager: ^3.4.1
  connectivity_plus: ^6.1.4
  lottie: ^3.5.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/map/
    - assets/weather/
