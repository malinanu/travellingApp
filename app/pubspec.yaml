name: spotto
description: "Spotto — your travel companion."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^18.1.0
  google_fonts: ^9.0.0
  flutter_svg: ^2.0.17
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^11.2.0
  dio: ^5.7.0
  url_launcher: ^6.3.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  geolocator: ^14.0.2
  image_picker: ^1.1.2
  video_player: ^2.9.2
  flutter_compass: ^0.8.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  google_maps_flutter: ^2.19.0
  flutter_cache_manager: ^3.4.1
  connectivity_plus: ^7.3.1
  lottie: ^3.5.1
  web_socket_channel: ^3.0.3
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

  path_provider: ^2.1.6
  sign_in_with_apple: ^8.2.0
  google_sign_in: ^7.2.0
  cached_network_image: ^4.0.4
  receive_sharing_intent: 1.9.0
  native_geofence: 1.3.1
  flutter_local_notifications: 22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/map/
    - assets/weather/
